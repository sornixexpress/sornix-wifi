<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Check activation</title>
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#0b1220;color:#e5e9f0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}main{max-width:520px;margin:auto;padding:16px 16px 90px}h1{font-size:1.4rem;margin:.4rem 0}h2{font-size:1.05rem;margin:.2rem 0 .6rem}.muted{color:#93a0b5}.err{color:#ff9b8f}.ok{color:#7fd6a4}.warn{color:#f5a524}.card{background:#141d30;border:1px solid #24304a;border-radius:10px;padding:14px;margin:10px 0}input,button,.btn{display:block;width:100%;margin:6px 0;padding:11px;border-radius:8px;border:1px solid #2c3a57;background:#0b1220;color:inherit;font:inherit;text-decoration:none;text-align:center}button.p,.btn.p{background:#f5a524;border-color:#f5a524;color:#1b1200;font-weight:700}.tabs{display:flex;gap:6px}.tabs button{width:auto;margin:0}.tabs .on{background:#24304a}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:6px 8px;border-bottom:1px solid #24304a;text-align:left}.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.85rem;font-weight:700}.c-ok{background:#12351f;color:#7fd6a4}.c-warn{background:#3a2c10;color:#f5a524}.c-err{background:#3a1512;color:#ff9b8f}.c-mut{background:#24304a;color:#93a0b5}</style></head><body><main>
<h1>Check your activation</h1>
<div class="tabs"><button class="on" id="t-o">Order ID</button><button id="t-v">Voucher PIN</button></div>
<div class="card" id="in"><input id="oid" placeholder="Order ID, for example SX-1A2B3C4D" autocomplete="off"><button class="p" id="chk">Check status</button></div>
<div class="card" id="st" hidden><h2 id="t"></h2><p id="d" class="muted"></p></div>
<div class="card" id="vh" hidden></div>
</main>
<script>
var API="/api",o=new URLSearchParams(location.search).get("order")||"",timer=null,tries=0,mode="order",q=function(s){return document.querySelector(s)};
var MSG={requested:["Waiting for payment confirmation","We have your order. The operator will confirm it once your transfer arrives."],
 approved:["Payment confirmed","Your plan is being activated on the router. This takes about a minute."],
 activated:["You are active","Reconnect to the Wi-Fi login page and choose Auto MAC, or sign in with your username."],
 rejected:["Order not approved","The operator could not confirm this order. Contact support with your order ID."],
 revoked:["Access removed","This order was revoked. Contact support if you believe this is a mistake."]};
function show(t,d,c){q("#st").hidden=false;q("#t").textContent=t;q("#t").className=c||"";q("#d").textContent=d}
function hideV(){q("#vh").hidden=true;q("#vh").textContent=""}
function poll(){clearTimeout(timer);if(mode!=="order")return;if(document.hidden){timer=setTimeout(poll,3000);return}
 fetch(API+"?action=getOrderStatus&order_id="+encodeURIComponent(o)).then(function(r){return r.json()}).then(function(r){
  if(!r.ok){show("Order not found","Check the order ID from your purchase.","err");return}
  var m=MSG[r.status]||["Status: "+r.status,""];show(m[0],m[1],r.status==="activated"?"ok":r.status==="rejected"||r.status==="revoked"?"err":"");
  if(r.status==="requested"||r.status==="approved"){if(++tries<600)timer=setTimeout(poll,3000);else show("Still waiting","This is taking longer than usual. Contact support with your order ID.","err")}
 }).catch(function(){timer=setTimeout(poll,3000)})}
function go(v){v=String(v||"").trim().toUpperCase();if(!/^SX-[0-9A-F]{8}$/.test(v)){show("Invalid order ID","Order IDs look like SX-1A2B3C4D.","err");return}o=v;tries=0;q("#oid").value=v;hideV();show("Checking…","");poll()}
function fmt(s){return s?String(s).slice(0,16).replace("T"," ")+" (WAT)":"-"}
function chip(st,active){if(st==="new")return['<span class="chip c-ok">UNUSED</span>',"This PIN has not been used yet."];
 if(st==="used"||st==="expired")return active?['<span class="chip c-ok">ACTIVE NOW</span>',"This PIN is online right now."]:
  (st==="expired"?['<span class="chip c-err">EXHAUSTED</span>',"The time on this PIN has finished."]:['<span class="chip c-warn">USED</span>',"Used, not online at this moment."]);
 if(st==="deleted")return['<span class="chip c-err">DELETED</span>',"This PIN was removed."];
 return['<span class="chip c-mut">'+st.toUpperCase()+'</span>',""]}
function checkVoucher(){var c=String(q("#oid").value||"").trim().toUpperCase();if(!c){show("Enter a voucher PIN","For example AB12-CD34-EF56.","err");return}
 q("#oid").value=c;hideV();show("Checking voucher…","");
 fetch(API+"?action=getVoucherStatus&code="+encodeURIComponent(c)).then(function(r){return r.json()}).then(function(r){
  if(!r.ok){show("Voucher not found","Check the PIN exactly as printed on your slip.","err");return}
  var ch=chip(r.status,r.active_now);show("Voucher "+r.code,ch[1],r.active_now?"ok":r.status==="new"?"ok":r.status==="deleted"||r.status==="expired"?"err":"warn");
  var box=q("#vh");box.hidden=false;box.textContent="";
  var h=document.createElement("div");h.innerHTML="<h2>"+ch[0]+" &nbsp;"+(r.plan||"")+"</h2>";box.appendChild(h);
  var meta=document.createElement("p");meta.className="muted";
  meta.innerHTML="Plan: <b>"+(r.plan||"-")+"</b>"+(r.validity?" &middot; "+r.validity:"")+(r.price!=null?" &middot; \u20A6"+r.price:"")+"<br>Created: "+fmt(r.created_at)+"<br>First login: "+fmt(r.used_at)+"<br>"+(r.status==="new"?"Not used yet.":(r.expires_at?"Valid until: "+fmt(r.expires_at):"No expiry set."));
  box.appendChild(meta);
  if(r.devices&&r.devices.length){var hh=document.createElement("h2");hh.textContent="Usage history (devices)";box.appendChild(hh);
   var t=document.createElement("table");
   var rows=r.devices.map(function(d){return"<tr><td>"+d.mac+"</td><td>"+fmt(d.first_seen)+"</td><td>"+fmt(d.last_seen)+"</td></tr>"}).join("");
   t.innerHTML="<tr><th>Device</th><th>First seen</th><th>Last seen</th></tr>"+rows;box.appendChild(t)}
  if(r.events&&r.events.length){var eh=document.createElement("h2");eh.textContent="Events";box.appendChild(eh);
   var e=document.createElement("table");
   e.innerHTML="<tr><th>When</th><th>Event</th></tr>"+r.events.map(function(x){return"<tr><td>"+fmt(x.at)+"</td><td>"+x.event.replace("_"," ")+"</td></tr>"}).join("");
   box.appendChild(e)}
  var rb=document.createElement("button");rb.textContent="Refresh";rb.onclick=checkVoucher;box.appendChild(rb);
 }).catch(function(){show("Network error","Try again in a moment.","err")})}
q("#chk").onclick=function(){if(mode==="voucher")checkVoucher();else go(q("#oid").value)};
q("#oid").onkeydown=function(e){if(e.key==="Enter")q("#chk").onclick()};
function setMode(m){mode=m;q("#t-o").className=m==="order"?"on":"";q("#t-v").className=m==="voucher"?"on":"";
 q("#oid").placeholder=m==="order"?"Order ID, for example SX-1A2B3C4D":"Voucher PIN, for example AB12-CD34-EF56";
 q("#chk").textContent=m==="order"?"Check status":"Check voucher";clearTimeout(timer);hideV();q("#st").hidden=true}
q("#t-o").onclick=function(){setMode("order")};q("#t-v").onclick=function(){setMode("voucher")};
if(o)go(o);
</script></body></html>
